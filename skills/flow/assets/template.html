<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow</title>
<style>/*VENDOR_CSS*/</style>
<style>
  :root, .canvas-light {
    --bg: #f6f7f9; --panel: #fff; --ink: #14171a; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2563eb;
    --start: #059669; --step: #64748b; --decision: #d97706;
    --io: #2563eb; --store: #7c3aed; --end: #dc2626; --fork: #0d9488; --state: #db2777;
    --success: #059669; --join: var(--fork);
    --ok: var(--success); --bad: var(--end);
  }
  /* The dark palette, written once. The page wears this class to follow the
     system; the canvas wears it on its own so it can be dark while the page is
     light, and an exported sheet carries it with it. */
  .canvas-dark {
    --bg: #0f1216; --panel: #171b21; --ink: #e8eaed; --muted: #9aa3ad;
    --line: #2a3038; --accent: #60a5fa;
    --start: #34d399; --step: #94a3b8; --decision: #fbbf24;
    --io: #60a5fa; --store: #a78bfa; --end: #f87171; --fork: #2dd4bf; --state: #f472b6;
    --success: #34d399;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #root { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap;
    padding: 0 16px; min-height: 45px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  /* The title occupies the tab rail for a single diagram; with several diagrams,
     the rail becomes the navigation and keeps the controls on the right. */
  header .tabs { display: flex; gap: 2px; flex: 1; min-width: 120px; }
  .flow-title {
    align-self: center; margin: 0; overflow: hidden; color: var(--ink);
    font-size: 14px; font-weight: 600; line-height: 1.25;
    text-overflow: ellipsis; white-space: nowrap;
  }
  header button {
    font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
    align-self: center; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
  }
  header button:hover { border-color: var(--accent); }
  button:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .export { position: relative; display: flex; align-self: center; }
  header .opener {
    align-self: center; font: inherit; font-size: 12px; padding: 4px 6px;
    color: var(--ink); background: var(--bg); cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px;
  }
  header .opener:hover { border-color: var(--accent); }
  /* Copying is the opener of last resort, so it wears the link it replaces. */
  .as-link {
    padding: 0; font: inherit; color: var(--accent); background: none;
    border: 0; cursor: pointer; text-align: left;
  }
  .as-link:hover { text-decoration: underline; }
  aside .steps .as-link { color: var(--muted); }
  aside .steps .as-link:hover { color: var(--accent); }
  .export-menu {
    position: absolute; z-index: 20; top: calc(100% + 5px); right: 0;
    min-width: 142px; padding: 4px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--ink) 14%, transparent);
  }
  header .export-menu button {
    display: block; width: 100%; padding: 6px 8px; text-align: left;
    background: none; border: 0;
  }
  header .export-menu button:hover { background: var(--bg); }
  .export-menu label {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px;
    margin-top: 4px; border-top: 1px solid var(--line); cursor: pointer;
  }
  /* A tab is navigation, not an option: no box, and its indicator sits down on
     the header's own bottom rule so the strip reads as the edge of the canvas. */
  header .tab {
    align-self: stretch; margin-bottom: -1px; padding: 0 11px;
    font-size: 14px; color: var(--muted); background: none;
    border: none; border-bottom: 2px solid transparent; border-radius: 0;
  }
  header .tab:hover { color: var(--ink); border-color: var(--line); }
  header .tab.on { color: var(--ink); font-weight: 500; border-bottom-color: var(--accent); }
  .edge-legend {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
    max-width: calc(100% - 30px); padding: 7px 9px;
    color: var(--muted); background: var(--panel); border-radius: 6px;
    font-size: 11px; white-space: nowrap; pointer-events: none;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-line { width: 26px; height: 8px; flex: none; overflow: visible; }
  .badge {
    font-size: 12px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid currentColor; cursor: help; align-self: center;
  }
  .badge.ok { color: var(--ok); padding: 2px 7px; }
  .badge.bad { color: var(--bad); }

  main { flex: 1; display: flex; min-height: 0; }
  /* Both, not just the background: colour inherits as a resolved value, so
     text under a flipped canvas has to pick up the palette here. */
  .canvas { flex: 1; min-width: 0; background: var(--bg); color: var(--ink); }
  .canvas-tools { display: flex; align-items: stretch; gap: 6px; }
  .canvas-theme {
    padding: 7px 9px; color: var(--muted); background: var(--panel);
    border: 0; border-radius: 6px; font: inherit; font-size: 11px;
    line-height: 1; cursor: pointer;
  }
  .canvas-theme:hover { color: var(--ink); }

  aside {
    width: clamp(288px, 27vw, 380px); flex: none; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  .mobile-back { display: none; }
  /* What the panel is about holds still; only the evidence for it scrolls. */
  .panel-head { flex: none; padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 17px 20px 28px; }

  aside h2 {
    margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600;
    letter-spacing: -.02em; overflow-wrap: anywhere;
  }
  /* One dense line under the title carrying every secondary fact: what kind of
     thing this is, and where it lives. Nothing above the heading. */
  aside .meta {
    display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
    margin-top: 8px; font-size: 12px; line-height: 1.45; color: var(--muted);
  }
  aside .meta .sep { opacity: .45; }
  aside .meta code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; overflow-wrap: anywhere;
  }
  aside .meta a { color: var(--accent); text-decoration: none; }
  aside .meta a:hover { text-decoration: underline; }
  aside .tag { display: inline-flex; align-items: center; gap: 5px; }
  aside .tag .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  aside .note { margin: 0 0 10px; font-size: 15px; font-style: italic; color: var(--muted); }
  aside .detail { margin: 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  /* A summary or a detail may run to several paragraphs; each is its own <p>. */
  aside .detail + .detail { margin-top: 11px; }
  aside .hint { margin: 16px 0 0; font-size: 15px; line-height: 1.55; color: var(--muted); }

  /* Where to read more: a web address, or a file opened in the editor. */
  aside .links { margin: 18px 0 0; padding: 0; list-style: none; }
  aside .links li { margin: 7px 0 0; font-size: 14px; line-height: 1.45; }
  aside .links a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  aside .links a:hover { text-decoration: underline; }
  aside .links .ref {
    display: block; margin-top: 1px; font-size: 11px; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  aside .trail { margin-top: 26px; padding-top: 15px; border-top: 1px solid var(--line); }
  aside .trail-label { font-size: 12px; color: var(--muted); }
  /* A spine through the numbers: this is one path in order, not a bag of links.
     Each number sits on the panel colour and masks the line behind it. */
  aside .steps {
    position: relative; margin: 12px 0 0; padding: 0 0 0 26px;
    list-style: none; counter-reset: step;
  }
  aside .steps::before {
    content: ''; position: absolute; left: 7px; top: 4px; bottom: 14px;
    width: 1px;
    /* --line is a border against a panel and disappears as a standalone rule;
       the spine has to carry the eye down five items. */
    background: color-mix(in srgb, var(--muted) 40%, transparent);
  }
  aside .steps li { position: relative; padding: 4px 0 10px; }
  /* Two things to do with a step, so two controls: open it, or open its file.
     A link inside a button would be neither. */
  aside .steps .open {
    display: block; width: 100%; padding: 0; text-align: left;
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
  }
  aside .steps li::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: -26px; top: 4px; width: 15px; padding: 2px 0;
    background: var(--panel); text-align: center;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  aside .steps li:hover, aside .steps li:hover::before { color: var(--accent); }
  aside .steps .open:focus-visible, aside .steps .ref:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px;
  }
  aside .steps .branch { margin-left: 6px; font-size: 12px; color: var(--decision); }
  aside .steps .ref {
    display: block; margin-top: 1px; font-size: 11px; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    text-decoration: none;
  }
  aside .steps a.ref:hover { color: var(--accent); text-decoration: underline; }

  /* The badge is loud about a broken trace, so its explanation cannot whisper. */
  aside .problems {
    margin: 20px 0 0; padding: 11px 13px 11px 28px; border-radius: 8px;
    font-size: 14px; color: var(--bad); border: 1px solid var(--bad);
    background: color-mix(in srgb, var(--bad) 9%, transparent);
  }
  aside .problems li { margin: 3px 0; }

  .node {
    border-radius: 8px; text-align: left; cursor: grab; transition: opacity .15s;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--step);
  }
  .node:active { cursor: grabbing; }
  .node .body { padding: 8px 12px; }
  /* A gap between the node and its ring, because --accent is also a kind colour
     — an `io` node is the same blue, and a plain thicker border read as one
     that had been selected. A halo is a shape no kind can imitate. */
  .node.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  }
  .node.dim { opacity: .22; }
  .react-flow__edge { transition: opacity .15s; }
  .react-flow__edge.dim { opacity: .1; }
  .react-flow__node:focus-visible .node {
    outline: 3px solid var(--accent); outline-offset: 4px;
  }
  .react-flow__edge:focus-visible .react-flow__edge-path {
    stroke-width: 4 !important;
  }
  .node .label { font-weight: 500; }
  .node .ref {
    display: flex; margin-top: 2px; font-size: 11px; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* The line number holds its width; the name is the only thing that can give. */
  .node .ref .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .ref .line { flex: none; }
  .node .note { margin-top: 2px; font-size: 12px; font-style: italic; color: var(--muted); }
  /* A state is a pill: rounded all the way, no leading bar, label centred —
     the UML rounded rectangle, which reads as "a place to be" rather than
     "a thing that happens". */
  .node-state {
    border: 1px solid var(--state); border-left-width: 1px; border-radius: 999px;
  }
  .node-state .body { padding: 8px 22px; text-align: center; }
  .node-start { border-left-color: var(--start); }
  /* A decision is a hexagon: the flowchart convention without a diamond's wasted
     width. clip-path cuts any border or shadow, so the outer box *is* the outline
     and the inner body sits 1px inside it. Handles stay on the clipped edges. */
  .node-decision {
    --point: 18px;
    border: none; border-radius: 0; padding: 1px;
    background: var(--decision);
    clip-path: polygon(0 50%, var(--point) 0, calc(100% - var(--point)) 0, 100% 50%,
                       calc(100% - var(--point)) 100%, var(--point) 100%);
  }
  .node-decision .body {
    padding: 8px 26px;
    background: var(--panel);
    clip-path: polygon(0 50%, var(--point) 0, calc(100% - var(--point)) 0, 100% 50%,
                       calc(100% - var(--point)) 100%, var(--point) 100%);
  }
  .node-decision.selected { background: var(--accent); padding: 2px; box-shadow: none; }
  .node-io { border-left-color: var(--io); }
  .node-store { border-left-color: var(--store); border-radius: 8px 8px 16px 16px; }
  .node-end { border-left-color: var(--end); }
  .node-success { border-left-color: var(--success); }
  /* A fork or join is a bar, not a box: "all of these happen" reads at a glance
     where a fourth box colour would not. */
  .node-fork, .node-join {
    border: none; border-radius: 3px; background: var(--fork);
    display: flex; align-items: center; justify-content: center;
  }
  .node-fork .body, .node-join .body {
    padding: 0 10px; font-size: 11px; font-weight: 700; color: var(--panel);
    letter-spacing: .06em; text-transform: uppercase;
    overflow: hidden; white-space: nowrap;
  }
  .node-fork .label, .node-join .label { overflow: hidden; text-overflow: ellipsis; }
  /* A bar is pinned to its height, so only the label fits. The note and the ref
     are still there — they read in the panel. */
  .node-fork .ref, .node-join .ref, .node-fork .note, .node-join .note { display: none; }
  .node-fork.selected, .node-join.selected {
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  }

  /* Labels are rendered into React Flow's label layer, above every path, so a
     line crossing the band cannot strike through the text that names it. */
  .edge-label {
    position: absolute;
    font-size: 11px; line-height: 1.4; color: var(--muted);
    background: var(--bg); padding: 0 4px; border-radius: 3px;
    white-space: nowrap; cursor: pointer; pointer-events: all;
  }
  .edge-label:hover { color: var(--ink); }
  /* Tracks .react-flow__edge.dim: a label must not outshout its own line. */
  .edge-label.dim { opacity: 0.1; }
  .react-flow__attribution { display: none; }
  /* React Flow ships a light-only chrome; re-point it at the theme tokens. */
  .react-flow__controls-button {
    background: var(--panel); border-bottom: 1px solid var(--line); fill: var(--ink);
  }
  .react-flow__controls-button:hover { background: var(--bg); }
  .react-flow__minimap { background: var(--panel); border: 1px solid var(--line); }
  .react-flow__minimap-mask { fill: var(--bg); fill-opacity: .6; }

  @media (max-width: 720px) {
    header { gap: 6px; padding: 0 10px; }
    header .tabs { min-width: 0; overflow-x: auto; }
    header .tab { flex: none; min-height: 44px; }
    header button:not(.tab) { min-height: 44px; }
    header .minimap-toggle { display: none; }
    .badge { white-space: nowrap; }

    main.has-selection .canvas, main:not(.has-selection) aside { display: none; }
    aside { width: 100%; border-left: 0; }
    .mobile-back {
      display: block; flex: none; align-self: flex-start;
      min-height: 44px; margin: 12px 16px 0;
      color: var(--ink); background: var(--bg);
      border: 1px solid var(--line); border-radius: 6px;
      font: inherit; font-weight: 500; padding: 7px 12px; cursor: pointer;
    }
    .panel-head { padding: 16px; }
    .panel-body { padding: 16px 16px 28px; }
    .edge-legend, .react-flow__minimap { display: none; }
    .react-flow__controls-button { width: 44px; height: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .node, .react-flow__edge { transition: none; }
  }
</style>
<!-- The page follows the system by wearing the canvas classes, so the dark
     palette lives in one place. In the head, because the body paints its
     background before the runtime below has finished parsing. -->
<script>
(function () {
  var dark = matchMedia('(prefers-color-scheme: dark)');
  function apply() {
    var root = document.documentElement.classList;
    root.toggle('canvas-dark', dark.matches);
    root.toggle('canvas-light', !dark.matches);
  }
  apply();
  dark.addEventListener('change', apply);
})();
</script>
</head>
<body>
<div id="root"></div>

<script id="flow-data" type="application/json">__FLOW_DATA__</script>
<script>/*VENDOR_JS*/</script>

<script>
(function () {
  'use strict';

  var h = React.createElement;
  var RF = ReactFlow;
  var useState = React.useState, useMemo = React.useMemo,
      useCallback = React.useCallback, useEffect = React.useEffect,
      useRef = React.useRef;

  // Shared so the load fit and every relayout fit agree; the two drifting apart
  // frames the graph differently depending on how you got there.
  var FIT = { padding: 0.15 };

  function widthOf(kind) { return kind === 'decision' ? 240 : 190; }

  // ponytail: estimated from the character count rather than measured. An 11px
  // proportional font puts this a few pixels out, which the gaps absorb.
  // Tracks .edge-label's font-size and horizontal padding; change those together.
  function labelWidth(text) { return text.length * 5.9 + 10; }

  // Estimated from the lines the body will hold: padding + label, then a note
  // and a ref if present. dagre spaces ranks off this, so a short guess crowds
  // every edge between them.
  function heightOf(n) {
    if (isBar(n.kind)) return 22;
    return 37 + (n.note ? 18 : 0) + (n.ref ? 17 : 0);
  }

  // SVG fills and the minimap don't resolve CSS vars, so the palette is read
  // out of the stylesheet once. Changing this list or any .node-* rule: build
  // assets/kinds-probe.json, which renders every kind once, and look at it.
  var KINDS = ['start', 'step', 'decision', 'io', 'store', 'end', 'success', 'fork', 'join', 'state'];
  var css = getComputedStyle(document.documentElement);
  var KIND_COLOR = KINDS.reduce(function (m, k) {
    m[k] = css.getPropertyValue('--' + k).trim();
    return m;
  }, Object.create(null));
  var ACCENT = css.getPropertyValue('--accent').trim();
  var MUTED = css.getPropertyValue('--muted').trim();

  // Unknown kinds fall back to 'step'; build.sh calls one out as a problem.
  function kindOf(kind) { return KINDS.indexOf(kind) === -1 ? 'step' : kind; }
  function isBar(kind) { return kind === 'fork' || kind === 'join'; }

  // Everything an edge kind means, in one row: its legend entry, its colour and
  // its dash. `progress: false` marks a kind that does not carry the flow
  // forward, so the upstream walk stops rather than crossing it — a retry points
  // back around a loop, and walking it would light sibling outcomes from earlier
  // iterations. Insertion order is the legend's order.
  var EDGE_KINDS = {
    '': { label: 'Flow' },
    async: { label: 'Async', dash: '7 5' },
    retry: { label: 'Retry', color: KIND_COLOR.decision, dash: '2 5', progress: false },
    error: { label: 'Error', color: KIND_COLOR.end }
  };
  function edgeKind(kind) { return EDGE_KINDS[kind] || EDGE_KINDS['']; }

  // Closes over nothing, so the minimap's memoised nodes keep their identity.
  function nodeColorOf(n) { return KIND_COLOR[n.data.kind]; }

  // Private to whoever opens the page, and absent in a locked-down browser.
  var MAP_KEY = 'flow:minimap';
  function readToggle(key) {
    try { return localStorage.getItem(key) !== '0'; } catch (e) { return true; }
  }
  function writeToggle(key, on) {
    try { localStorage.setItem(key, on ? '1' : '0'); } catch (e) { /* no store */ }
  }

  function fileName(title, ext) {
    var base = (title || 'flow').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return (base || 'flow') + '.' + ext;
  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url; link.download = name;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportBounds(nodes, root) {
    var box = nodes.reduce(function (b, n) {
      var w = n.width || n.data.width || 0, ht = n.height || n.data.height || 0;
      b.x1 = Math.min(b.x1, n.position.x); b.y1 = Math.min(b.y1, n.position.y);
      b.x2 = Math.max(b.x2, n.position.x + w); b.y2 = Math.max(b.y2, n.position.y + ht);
      return b;
    }, { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity });
    root.querySelectorAll('.react-flow__edge').forEach(function (edge) {
      try {
        var e = edge.getBBox();
        box.x1 = Math.min(box.x1, e.x); box.y1 = Math.min(box.y1, e.y);
        box.x2 = Math.max(box.x2, e.x + e.width); box.y2 = Math.max(box.y2, e.y + e.height);
      } catch (ignore) { /* detached SVG */ }
    });
    return box;
  }

  function svgExport(nodes, title, withBackground) {
    var source = document.querySelector('.canvas .react-flow');
    if (!source) throw new Error('Flow canvas not found');
    var clone = source.cloneNode(true), bounds = exportBounds(nodes, source), pad = 32;
    var graphWidth = Math.ceil(bounds.x2 - bounds.x1 + pad * 2);
    var graphHeight = Math.ceil(bounds.y2 - bounds.y1 + pad * 2);
    var width = Math.max(640, graphWidth), headHeight = 64, height = graphHeight + headHeight;
    var canvas = source.closest('.canvas');
    var theme = getComputedStyle(canvas);
    var bodyStyle = getComputedStyle(document.body);
    var sheet = document.createElement('div'), head = document.createElement('div');
    var heading = document.createElement('div'), legend = source.querySelector('.edge-legend').cloneNode(true);
    sheet.className = canvas.classList.contains('canvas-dark') ? 'canvas-dark' : 'canvas-light';
    sheet.style.width = width + 'px'; sheet.style.height = height + 'px';
    if (withBackground) sheet.style.background = theme.getPropertyValue('--bg');
    sheet.style.color = theme.getPropertyValue('--ink');
    sheet.style.fontFamily = bodyStyle.fontFamily;
    sheet.style.fontSize = bodyStyle.fontSize;
    sheet.style.lineHeight = bodyStyle.lineHeight;
    head.style.cssText = 'height:' + headHeight + 'px;display:flex;align-items:center;' +
      'justify-content:space-between;gap:24px;padding:0 20px;border-bottom:1px solid ' +
      theme.getPropertyValue('--line');
    heading.textContent = title;

      function close(ev) {
        if (ev.type === 'keydown' && ev.key !== 'Escape') return;
        if (ev.type === 'mousedown' && exportRef.current.contains(ev.target)) return;
        setShowExport(false);
        if (ev.type === 'keydown') exportRef.current.querySelector('[aria-haspopup="menu"]').focus();
      }
      addEventListener('mousedown', close); addEventListener('keydown', close);
      return function () { removeEventListener('mousedown', close); removeEventListener('keydown', close); };
    }, [showExport]);

    var laidOut = useMemo(function () { return layout(f.nodeList, f.edgeItems, dir); }, [f, dir]);
    var placedNodes = laidOut.nodes, routes = laidOut.routes;

    // Selecting anything asks the same question: what leads here?
    var lit = useMemo(function () {
      if (!sel) return null;
      var at = placedNodes.reduce(function (m, n) {
        m[n.id] = dir === 'TB' ? n.position.y : n.position.x;
        return m;
      }, Object.create(null));
      var id = sel.kind === 'node' ? sel.id : f.edgeById[sel.id].from;
      var up = upstream(f, id);

      // A selected node has a shape: the route is one way in and it may have
      // others, which light too, or a step with two parents looks as though it
      // had one. Only the ones the layout draws arriving, though — an edge from
      // a node placed further down is the loop coming back, and lighting that
      // reads as the selection pointing at something. Lit at -1, so they stay
      // out of the trail, which is still a single path.
      //
      // A selected edge has no such shape. It asks what leads to this one edge,
      // so the other ways into the node it leaves are no part of the answer.
      if (sel.kind === 'node') {
        (f.incoming[id] || []).forEach(function (e) {
          if (at[e.from] < at[e.to] && up.dist[e.from] === undefined) up.dist[e.from] = -1;
        });
      }
      // Then every edge between two lit nodes, in either direction. Which nodes
      // light is already settled above, so this only draws what runs between
      // them: an added parent hangs off the route instead of floating, a second
      // edge between the same pair lights beside the first, and the loop home
      // lights when both its ends are on show. A dim node keeps its edges dim,
      // which is what holds the loop back in the first place.
      f.edgeItems.forEach(function (e) {
        if (up.dist[e.from] !== undefined && up.dist[e.to] !== undefined) {
          up.edges[e.id] = true;
        }
      });

      if (sel.kind === 'edge') {
        var e = f.edgeById[sel.id];
        up.edges[e.id] = true;
        // Lit, but not a step that leads here: it is where this edge arrives.
        if (up.dist[e.to] === undefined) up.dist[e.to] = -1;
      }
      return up;
    }, [f, sel, placedNodes, dir]);

    var nodes = useMemo(function () {
      return placedNodes.map(function (n) {
        return Object.assign({}, n, {
          data: Object.assign({}, n.data, {
            selected: !!sel && sel.kind === 'node' && sel.id === n.id,
            dim: !!lit && lit.dist[n.id] === undefined
          })
        });
      });
    }, [placedNodes, sel, lit]);

    // Relayout moves every node, so the old viewport frames nothing.
    var fitView = RF.useReactFlow().fitView;
    useEffect(function () { fitView(FIT); }, [f, dir, fitView]);

    var selectEdge = useCallback(function (id) {
      setSel({ kind: 'edge', id: id });
    }, []);

    // Everything about an edge that a selection cannot change. Clicking rebuilds
    // only the layer below, so the geometry, the aria text and the label
    // handlers are built once per layout instead of once per click.
    var baseEdges = useMemo(function () {
      return f.edgeItems.map(function (e) {
        var kind = edgeKind(e.kind), route = routes[e.id];
        return {
          id: e.id, source: e.from, target: e.to, label: e.label || undefined,
          ariaLabel: (e.label ? e.label + ': ' : '') + labelOf(f, e.from) +
            ' to ' + labelOf(f, e.to) + '. Select to inspect this transition.',
          sourceHandle: 'sout', targetHandle: 'tin',
          type: 'flow',
          // A kind's colour is information and always shows; the accent is
          // state, so it only paints where the kind has nothing to say. With
          // nothing selected there is no state, so every edge sits at rest.
          color: kind.color,
          data: {
            route: route || null,
            loop: route ? null : {
              x: widthOf(f.nodeById[e.from].kind) / 2 + 70,
              y: heightOf(f.nodeById[e.from]) / 2 + 60
            },
            dim: false,
            // The label is outside the edge's own group, so React Flow's edge
            // click never reaches it; it selects the edge itself.
            select: function () { selectEdge(e.id); }
          },
          style: {
            stroke: kind.color || MUTED, strokeWidth: 1.5, strokeDasharray: kind.dash
          },
          // The marker id is built from every field here, so an undefined colour
          // yields a marker that paints nothing. Always name it.
          markerEnd: {
            type: RF.MarkerType.ArrowClosed, color: kind.color || MUTED
          }
        };
      });
    }, [f, routes, selectEdge]);

    // With nothing selected there is no state to paint, so the array built above
    // is handed straight through and every edge keeps its identity.
    var edges = useMemo(function () {
      if (!lit) return baseEdges;
      return baseEdges.map(function (b) {
        var on = !!lit.edges[b.id];
        // A node wears a ring when it is the selection; an edge had nothing, so
        // the one that was clicked looked no different from the route drawn to
        // reach it. Weight says which is which.
        var picked = sel.kind === 'edge' && sel.id === b.id;
        var stroke = b.color || (on ? ACCENT : MUTED);
        return Object.assign({}, b, {
          data: Object.assign({}, b.data, { dim: !on }),
          className: on ? undefined : 'dim',
          style: Object.assign({}, b.style, {
            stroke: stroke, strokeWidth: picked ? 3.5 : (on ? 2 : 1.5)
          }),
          markerEnd: { type: RF.MarkerType.ArrowClosed, color: stroke }
        });
      });
    }, [baseEdges, lit, sel]);

    var onNodeClick = useCallback(function (_, node) {
      setSel({ kind: 'node', id: node.id });
    }, []);
    var onEdgeClick = useCallback(function (_, edge) {
      selectEdge(edge.id);
    }, [selectEdge]);

    // The hash is what says which tab is open; the hashchange listener above
    // clears the selection, and the relayout effect clears any hand placement.
    function openTab(i) { location.hash = tabIds[i]; }

    function runExport(format) {
      setShowExport(false);
      // svgExport throws synchronously when the canvas is missing, so the call
      // goes through a promise to keep both failures on one handler.
      Promise.resolve().then(function () {
        return exportFlow(nodes, f.title || doc.title || 'Flow', format, exportBg);
      }).catch(function (error) {
        console.error(error); alert('Could not export this flow.');
      });
    }

    // Which way this step went. Only lit edges count, so it names the branch
    // actually taken; a graph that re-converges names both.
    function branchOut(id) {
      return unique((f.outgoing[id] || [])
        .filter(function (e) { return lit.edges[e.id] && e.label; })
        .map(function (e) { return e.label; })).join(' / ');
    }

    // The steps that lead here, start first — the reason the highlight lit up.
    function trail(minDist) {
      var ids = stepsInto(lit, minDist);
      if (!ids.length) {
        return h('p', { className: 'hint' }, 'Nothing leads here. This is a starting point.');
      }
      return h('div', { className: 'trail' },
        h('div', { className: 'trail-label' }, leadIn(ids.length)),
        h('ol', { className: 'steps' }, ids.map(function (id) {
          var n = f.nodeById[id];
          var branch = branchOut(id);
          function open() { setSel({ kind: 'node', id: id }); }
          return h('li', { key: id },
            h('button', { className: 'open', onClick: open },
              labelOf(f, id),
              branch ? h('span', { className: 'branch' }, '→ ' + branch) : null
            ),
            n.refLink
              ? fileLink(n.refLink, n.ref, 'ref', editor)
              : (n.ref ? h('span', { className: 'ref' }, n.ref) : null)
          );
        }))
      );
    }

    // Every state of the panel takes the same shape: a title that names the
    // subject, one meta line of secondary facts, then the body it earns.
    function panel() {
      if (sel && sel.kind === 'node') {
        var n = f.nodeById[sel.id];
        var kind = kindOf(n.kind);
        return h(React.Fragment, null,
          panelHead(n.label || n.id, [
            tag(KIND_COLOR[kind], kind),
            n.ref
              ? h('code', { key: 'ref' },
                  // Only a ref with a file behind it opens; the rest is still
                  // worth showing.
                  n.refLink ? fileLink(n.refLink, n.ref, null, editor) : n.ref)
              : null
          ]),
          h('div', { className: 'panel-body' },
            n.note ? h('p', { className: 'note' }, n.note) : null,
            paragraphs(n.detail || 'No detail recorded for this step.', 'detail'),
            linkList(n.links, editor),
            trail(1)
          )
        );
      }
      if (sel) {
        var e = f.edgeById[sel.id];
        // An unlabelled edge has no name of its own, so the transition becomes
        // the title rather than the word "unlabelled".
        var move = labelOf(f, e.from) + ' → ' + labelOf(f, e.to);
        return h(React.Fragment, null,
          panelHead(e.label || move, [
            tag(edgeKind(e.kind).color || MUTED, e.kind || 'edge'),
            e.label ? h('span', { key: 'ends' }, move) : null
          ]),
          h('div', { className: 'panel-body' },
            e.detail
              ? paragraphs(e.detail, 'detail')
              : h('p', { className: 'hint' }, 'No detail recorded for this edge.'),
            linkList(e.links, editor),
            trail(0)
          )
        );
      }
      // Nothing selected: the diagram introduces itself. This is where the title
      // and the summary live, so the header is free to carry the tabs.
      return h(React.Fragment, null,
        panelHead(f.title || doc.title || 'Flow', [
          doc.title && doc.title !== f.title
            ? h('span', { key: 'doc' }, doc.title) : null,
          h('span', { key: 'n' }, f.nodeList.length + ' nodes'),
          h('span', { key: 'e' }, f.edgeItems.length + ' edges')
        ]),
        h('div', { className: 'panel-body' },
          f.summary ? paragraphs(f.summary, 'detail') : null,
          linkList(f.links, editor),
          h('p', { className: 'hint' }, 'Select a node or an edge to see what leads there. Hold Shift while scrolling to pan.'),
          f.problems.length
            ? h('ul', { className: 'problems' }, f.problems.map(function (t, i) {
                return h('li', { key: i }, t);
              }))
            : null
        )
      );
    }

    return h(React.Fragment, null,
      h('header', null,
        h('div', { className: 'tabs', 'aria-label': flows.length > 1 ? 'Flows' : null },
          flows.length > 1
          ? [h('h1', { className: 'flow-title sr-only', key: 'title' }, doc.title || 'Flow')]
              .concat(flows.map(function (fl, i) {
              return h('button', {
                key: i,
                className: 'tab' + (i === tab ? ' on' : ''),
                'aria-current': i === tab ? 'page' : null,
                onClick: function () { openTab(i); }
              }, fl.title || 'Flow ' + (i + 1));
            }))
          : h('h1', { className: 'flow-title' }, f.title || doc.title || 'Flow')),
        h('button', { onClick: function () { setDir(dir === 'TB' ? 'LR' : 'TB'); } },
          dir === 'TB' ? 'Left to right' : 'Top to bottom'),
        h('button', {
          className: 'minimap-toggle',
          onClick: function () { writeToggle(MAP_KEY, !showMap); setShowMap(!showMap); }
        }, showMap ? 'Hide minimap' : 'Show minimap'),
        // Only worth asking where files should open when there are files.
        doc.hasFileLinks ? h('select', {
          className: 'opener', value: editor, 'aria-label': 'Open files in',
          onChange: function (ev) {
            setEditor(ev.target.value);
            try { localStorage.setItem(EDITOR_KEY, ev.target.value); } catch (e) { /* no store */ }
          }
        }, Object.keys(OPENERS).map(function (key) {
          return h('option', { key: key, value: key }, OPENERS[key].label);
        })) : null,
        h('div', { className: 'export', ref: exportRef },
          h('button', {
            'aria-haspopup': 'menu', 'aria-expanded': showExport,
            onClick: function () { setShowExport(!showExport); }
          }, 'Export ↓'),
          showExport ? h('div', { className: 'export-menu', role: 'menu' },
            h('button', { role: 'menuitem', onClick: function () { runExport('svg'); } }, 'Export as SVG'),
            h('button', { role: 'menuitem', onClick: function () { runExport('png'); } }, 'Export as PNG'),
            h('label', null,
              h('input', {
                type: 'checkbox', checked: exportBg,
                onChange: function (ev) { setExportBg(ev.target.checked); }
              }),
              'Background')
          ) : null
        ),
        f.problems.length
          ? h('span', { className: 'badge bad', title: f.problems.join('\n') },
              f.problems.length + ' problem' + (f.problems.length > 1 ? 's' : ''))
          : h('span', {
              className: 'badge ok',
              title: f.nodeList.length + ' nodes checked at build time: ids ' +
                     'unique, kinds known, every edge resolves, every decision ' +
                     'branches, every path reaches an end.'
            }, 'Trace valid')
      ),
      h('main', { className: sel ? 'has-selection' : '' },
        h('div', { className: 'canvas canvas-' + canvasTheme },
          h(RF.ReactFlow, {
            nodes: nodes, edges: edges, nodeTypes: nodeTypes, edgeTypes: edgeTypes,
            nodesDraggable: false,
            onNodeClick: onNodeClick, onEdgeClick: onEdgeClick,
            onPaneClick: function () { setSel(null); },
            fitView: true, fitViewOptions: FIT,
            // Held, Shift turns wheel/two-finger scroll into a pan instead of a
            // zoom. Shift is also React Flow's box-select key, and box-select
            // does nothing here, so that binding is dropped rather than shared.
            panActivationKeyCode: 'Shift', selectionKeyCode: null,
            proOptions: { hideAttribution: true },
            minZoom: 0.1
          },
            h(RF.Controls, { showInteractive: false }),
            showMap ? h(RF.MiniMap, {
              pannable: true, zoomable: true, nodeColor: nodeColorOf
            }) : null,
            h(RF.Panel, { position: 'top-right', className: 'canvas-tools' },
              h('div', {
                className: 'edge-legend', role: 'list', 'aria-label': 'Edge legend'
              }, Object.keys(EDGE_KINDS).map(function (key) {
                var item = EDGE_KINDS[key];
                return h('span', { className: 'legend-item', role: 'listitem', key: key },
                  h('svg', { className: 'legend-line', viewBox: '0 0 26 8', 'aria-hidden': 'true' },
                    h('line', {
                      x1: 1, y1: 4, x2: 25, y2: 4, strokeWidth: 2,
                      stroke: item.color || MUTED, strokeDasharray: item.dash
                    })
                  ),
                  item.label
                );
              })),
              h('button', {
                className: 'canvas-theme',
                title: 'Switch the diagram to ' + (canvasTheme === 'dark' ? 'light' : 'dark'),
                onClick: function () {
                  setCanvasTheme(canvasTheme === 'dark' ? 'light' : 'dark');
                }
              }, canvasTheme === 'dark' ? 'Light' : 'Dark')
            )
          )
        ),
        h('aside', null,
          sel ? h('button', {
            className: 'mobile-back', onClick: function () { setSel(null); }
          }, 'Back to flow') : null,
          panel()
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root'))
    .render(h(RF.ReactFlowProvider, null, h(App, null)));
})();
</script>
</body>
</html>
